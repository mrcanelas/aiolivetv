name: Deploy Vercel

# Git auto-deploys are off (`git.deploymentEnabled` in vercel.json). Production
# deploys run when a GitHub Release is published (release-please or manual).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Git tag or SHA to deploy
        required: true
        type: string

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref }}

      - name: Check Vercel secrets
        run: |
          missing=()
          [[ -n "$VERCEL_TOKEN" ]] || missing+=(VERCEL_TOKEN)
          [[ -n "$VERCEL_ORG_ID" ]] || missing+=(VERCEL_ORG_ID)
          [[ -n "$VERCEL_PROJECT_ID" ]] || missing+=(VERCEL_PROJECT_ID)
          if (( ${#missing[@]} )); then
            echo "Missing GitHub secrets: ${missing[*]}"
            exit 1
          fi

      # The CLI always preflights GET /v2/user. Project- and team-scoped tokens
      # return 404 "User not found" here even when they can deploy the project.
      - name: Check Vercel token scope
        run: |
          code=$(curl -sS -o /tmp/vercel-user.json -w "%{http_code}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            https://api.vercel.com/v2/user)
          if [[ "$code" != "200" ]]; then
            echo "::error::VERCEL_TOKEN cannot call GET /v2/user (HTTP $code). Recreate it at https://vercel.com/account/tokens with Full Account scope. Project-scoped and team-scoped tokens fail this CLI check."
            cat /tmp/vercel-user.json
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Container projects (Dockerfile.vercel) must be built on Vercel. Do not
      # use `vercel pull` + `vercel build --prebuilt`; that path is for the
      # Build Output API. VERCEL_ORG_ID + VERCEL_PROJECT_ID link the project.
      - name: Deploy production
        run: vercel deploy --yes --prod
