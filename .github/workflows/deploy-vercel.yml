name: Deploy Vercel

# Git auto-deploys are off (`git.deploymentEnabled` in vercel.json). Production
# deploys run when a GitHub Release is published (release-please or manual).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Git tag or SHA to deploy
        required: true
        type: string

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref }}

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Container projects (Dockerfile.vercel) must be built on Vercel. Do not
      # use `vercel build --prebuilt`; that path is for the Build Output API.
      - name: Deploy production
        run: vercel deploy --yes --prod --token=${{ secrets.VERCEL_TOKEN }}
