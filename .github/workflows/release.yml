name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: aiolivetv-release
  cancel-in-progress: false

jobs:
  release:
    name: release
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Trigger Docker Image Publish
        if: ${{ steps.release.outputs['release_created'] }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          gh workflow run --repo ${GITHUB_REPOSITORY} deploy-docker.yml -f ref=${TAG_NAME}

      - name: Credit release contributors
        if: ${{ !steps.release.outputs.release_created }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const marker = '<!-- release-contributors -->';
            const clean = text => text.split(marker)[0].trimEnd();
            const read = async (path, ref) => {
              const { data } = await github.rest.repos.getContent({ owner, repo, path, ref });
              return { sha: data.sha, text: Buffer.from(data.content, 'base64').toString('utf8') };
            };
            const manifest = JSON.parse((await read('.release-please-manifest.json', 'main')).text);
            const base = 'v' + manifest['.'];
            const { data: main } = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            const commits = [];
            for (let page = 1; ; page++) {
              const { data } = await github.rest.repos.compareCommitsWithBasehead({
                owner, repo, basehead: base + '...' + main.object.sha, per_page: 100, page
              });
              commits.push(...data.commits);
              if (data.commits.length < 100) break;
            }
            const contributors = [...new Set(commits.flatMap(commit => {
              const login = commit.author?.login;
              return login && !login.endsWith('[bot]') && commit.author.type !== 'Bot' ? [login] : [];
            }))].sort((a, b) => a.localeCompare(b));
            if (!contributors.length) return;
            const nl = String.fromCharCode(10);
            const thanks = '### Contributors' + nl + nl + 'Thanks to ' + contributors.map(login => '@' + login).join(', ') + ' for the contributions included in this release.';
            const pulls = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', base: 'main', per_page: 100 });
            for (const pr of pulls.filter(pr => pr.head.repo?.full_name === owner + '/' + repo && pr.head.ref.startsWith('release-please--') && pr.labels.some(label => label.name === 'autorelease: pending'))) {
              const changelog = await read('CHANGELOG.md', pr.head.ref);
              const first = changelog.text.search(/^## /m);
              if (first < 0) throw new Error('Release changelog has no version heading');
              const rest = changelog.text.slice(first);
              const next = rest.slice(1).search(/^## /m);
              const end = next < 0 ? changelog.text.length : first + 1 + next;
              const entry = clean(changelog.text.slice(first, end));
              const updated = changelog.text.slice(0, first) + entry + nl + nl + marker + nl + thanks + nl + nl + changelog.text.slice(end);
              if (updated !== changelog.text) {
                await github.rest.repos.createOrUpdateFileContents({
                  owner, repo, path: 'CHANGELOG.md', branch: pr.head.ref, sha: changelog.sha,
                  message: 'chore(release): credit contributors',
                  content: Buffer.from(updated).toString('base64')
                });
              }
              const body = clean(pr.body || '') + nl + nl + marker + nl + thanks;
              if (body !== pr.body) await github.rest.pulls.update({ owner, repo, pull_number: pr.number, body });
            }
