name: Deploy Beamup

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Git tag or SHA to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: beamup-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BEAMUP_HOST: a.baby-beamup.club
      BEAMUP_PROJECT: aiolivetv
      BEAMUP_URL: https://94c8cb9f702d-aiolivetv.baby-beamup.club
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      # Requires the server-side Dockerfile config fix from stremio-beamup#121.
      # Configuration stays on Beamup; never copy secrets into this checkout.
      - name: Validate Beamup runtime configuration
        env:
          BEAMUP_SSH_PRIVATE_KEY: ${{ secrets.BEAMUP_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$BEAMUP_SSH_PRIVATE_KEY" || { echo 'Missing BEAMUP_SSH_PRIVATE_KEY'; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$BEAMUP_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/beamup-config-key"
          ssh-keyscan -H "$BEAMUP_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib, subprocess, sys
          owner = os.environ['GITHUB_REPOSITORY_OWNER'].lower()
          app = hashlib.sha256((owner + '\n').encode()).hexdigest()[:12] + '/' + os.environ['BEAMUP_PROJECT']
          ssh = ['ssh', '-T', '-i', os.environ['RUNNER_TEMP'] + '/beamup-config-key',
                 '-o', 'BatchMode=yes', '-o', 'IdentitiesOnly=yes', '-o', 'ConnectTimeout=15',
                 'dokku@' + os.environ['BEAMUP_HOST']]
          for name in ['BASE_URL', 'SECRET_KEY', 'DATABASE_URI', 'AIOLIVETV_AUTH']:
              result = subprocess.run(ssh + ['config:get', app, name], capture_output=True, timeout=45)
              if result.returncode:
                  sys.exit('Could not read ' + name + ' from Beamup; deploy aborted.')
              value = result.stdout.decode('utf-8').removesuffix('\n')
              if not value.strip() or '\x00' in value or value.startswith('ERR '):
                  sys.exit('Missing or invalid ' + name + '; deploy aborted.')
              if '\n' in value or '\r' in value:
                  sys.exit(name + ' contains a newline, which Beamup does not forward to Dockerfile apps; deploy aborted.')
              if name == 'BASE_URL' and value.rstrip('/') != os.environ['BEAMUP_URL'].rstrip('/'):
                  sys.exit('BASE_URL does not match BEAMUP_URL; deploy aborted.')
              print(name + ': configured (value hidden)')
          version = json.loads(pathlib.Path('package.json').read_text())['version']
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('BEAMUP_EXPECTED_VERSION=' + version + '\n')
              env.write('BEAMUP_DEPLOY_STARTED_AT=' + datetime.datetime.now(datetime.timezone.utc).isoformat() + '\n')
          PY

      - name: Deploy to Beamup
        uses: Stremio/beamup-deploy-action@v1.0.1
        with:
          ssh_private_key: ${{ secrets.BEAMUP_SSH_PRIVATE_KEY }}
          beamup_host: ${{ env.BEAMUP_HOST }}
          username_github: ${{ github.repository_owner }}
          project_name: ${{ env.BEAMUP_PROJECT }}

      - name: Verify deployed version and database health
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, json, os, subprocess, sys, time

          def request(endpoint):
              try:
                  url = os.environ['BEAMUP_URL'] + endpoint + '?deploy=' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT']
                  response = subprocess.run(
                      ['curl', '--silent', '--show-error', '--connect-timeout', '10',
                       '--max-time', '15', '--header', 'Cache-Control: no-cache',
                       '--write-out', '\n%{http_code}', url],
                      capture_output=True, timeout=20)
                  body, _, status = response.stdout.rpartition(b'\n')
                  code = status.decode('ascii', errors='replace')
                  detail = 'curl=' + str(response.returncode) + ', HTTP=' + code
                  if response.returncode == 0 and code == '200':
                      try:
                          payload = json.loads(body)
                          if isinstance(payload, dict) and payload.get('success') is True:
                              return payload, detail
                      except (ValueError, UnicodeError):
                          detail += ', invalid JSON'
                  return None, detail
              except subprocess.TimeoutExpired:
                  return None, 'request timed out'

          for attempt in range(24):
              status, status_detail = request('/api/v1/status')
              health, health_detail = request('/api/v1/health')
              data = (status or {}).get('data')
              fresh = False
              try:
                  built = datetime.datetime.fromisoformat(data['buildTime'].replace('Z', '+00:00'))
                  started = datetime.datetime.fromisoformat(os.environ['BEAMUP_DEPLOY_STARTED_AT'])
                  fresh = built >= started
              except (KeyError, TypeError, ValueError, AttributeError):
                  pass
              current = (
                  fresh and isinstance(data, dict)
                  and data.get('version') == os.environ['BEAMUP_EXPECTED_VERSION']
                  and isinstance(data.get('settings'), dict)
                  and isinstance(data['settings'].get('baseUrl'), str)
                  and data['settings']['baseUrl'].rstrip('/') == os.environ['BEAMUP_URL'].rstrip('/')
              )
              if current and health:
                  print('Verified: expected version and BASE_URL are live; database health returned HTTP 200.')
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                      summary.write('Beamup deployment verified: expected version and BASE_URL are live, and /api/v1/health confirmed database connectivity.\n')
                  break
              print('Waiting for deployment (' + str(attempt + 1) + '/24); expected version/base URL=' + str(current) + '; status: ' + status_detail + '; health: ' + health_detail)
              time.sleep(5)
          else:
              sys.exit('Beamup deployment verification failed. Confirm the server has stremio-beamup#121 and the runtime configuration is valid. Response bodies are withheld to avoid exposing secrets.')
          PY

      - name: Remove temporary SSH key
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/beamup-config-key"
