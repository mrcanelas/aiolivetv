name: Build and Deploy Docker Images

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git Ref
        required: true
        type: string

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
      channel: ${{ steps.tags.outputs.channel }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate tags
        id: tags
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          # Accept stable releases and Docker-compatible prerelease versions.
          if [[ ! "${INPUT_REF}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[a-zA-Z0-9-]+(\.[a-zA-Z0-9-]+)*)?$ || ${#INPUT_REF} -gt 128 ]]; then
            echo "Invalid version: ${INPUT_REF}; expected vMAJOR.MINOR.PATCH[-PRERELEASE]"
            exit 1
          fi

          MAJOR="${BASH_REMATCH[1]}"
          MAJOR_MINOR="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          PRERELEASE="${BASH_REMATCH[4]}"
          TAGS="${INPUT_REF}"
          # Prereleases never receive latest or stable major/minor aliases.
          if [[ -z "${PRERELEASE}" && "$(git rev-parse origin/main)" = "$(git rev-parse "${INPUT_REF}")" ]]; then
            TAGS="${TAGS} latest v${MAJOR_MINOR} v${MAJOR}"
          fi
          # Release metadata uses the package version, including its beta suffix.
          CHANNEL="stable"

          if [[ -z "${TAGS}" ]]; then
            echo "Empty Tags!"
            exit 1
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "channel=${CHANNEL}" >> $GITHUB_OUTPUT

  build:
    name: build (${{ matrix.suffix }})
    needs: setup
    permissions:
      packages: write
      contents: read
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Generate metadata
        run: node scripts/generateMetadata.cjs --channel=${{ needs.setup.outputs.channel }}

      - name: Build & Push
        id: build
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platform }}
          push: true
          context: .
          file: ./Dockerfile
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/aiolivetv,push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}

      - name: Export digest
        run: echo "${{ steps.build.outputs.digest }}" > "/tmp/${{ matrix.suffix }}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v7
        with:
          path: /tmp/${{ matrix.suffix }}
          archive: false
          retention-days: 1

  merge:
    name: Merge manifests
    needs: [setup, build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: '{amd64,arm64}'
          merge-multiple: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create and push manifests
        env:
          TAGS: ${{ needs.setup.outputs.tags }}
        run: |
          for tag in ${TAGS}; do
            docker buildx imagetools create \
              -t "ghcr.io/${{ github.repository_owner }}/aiolivetv:${tag}" \
              "ghcr.io/${{ github.repository_owner }}/aiolivetv@$(cat /tmp/digests/amd64)" \
              "ghcr.io/${{ github.repository_owner }}/aiolivetv@$(cat /tmp/digests/arm64)"
          done

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish to Docker Hub
        env:
          TAGS: ${{ needs.setup.outputs.tags }}
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/aiolivetv
          DOCKERHUB_IMAGE: docker.io/mrcanelas/aiolivetv
          VERSION: ${{ inputs.ref }}
        run: |
          # Copy the complete multi-platform image once with all release tags.
          # No rebuild is needed, and both amd64 and arm64 are preserved.
          TAG_ARGS=()
          for tag in ${TAGS}; do
            TAG_ARGS+=(--tag "${DOCKERHUB_IMAGE}:${tag}")
          done
          docker buildx imagetools create \
            "${TAG_ARGS[@]}" \
            "${GHCR_IMAGE}:${VERSION}"

      - name: Send Discord Notification
        continue-on-error: true
        env:
          CHANNEL: ${{ needs.setup.outputs.channel }}
          TAGS: ${{ needs.setup.outputs.tags }}
          RELEASE_REF: ${{ inputs.ref }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is not set; skipping notification."
            exit 0
          fi
          if [[ "$RELEASE_REF" == *-* ]]; then
            COLOR=15844367  # Orange
            TITLE="🧪 Prerelease"
          elif [ "$CHANNEL" = "stable" ]; then
            COLOR=5763719  # Green
            TITLE="🎉 Stable Release"
          else
            COLOR=15844367  # Orange
            TITLE="🌙 Nightly Build"
          fi

          # Format tags for display (each tag on a new line with bullet points)
          FORMATTED_TAGS=""
          for tag in $TAGS; do
            if [ -z "$FORMATTED_TAGS" ]; then
              FORMATTED_TAGS="• \`$tag\`"
            else
              FORMATTED_TAGS="$FORMATTED_TAGS\n• \`$tag\`"
            fi
          done

          # Get current timestamp in ISO 8601 format UTC
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Create JSON payload file
          cat << EOF > discord_payload.json
          {
            "embeds": [
              {
                "title": "$TITLE - Docker Images Published",
                "description": "New Docker images have been built and pushed to registries.",
                "color": $COLOR,
                "fields": [
                  {
                    "name": "📦 Channel",
                    "value": "• \`$CHANNEL\`",
                    "inline": true
                  },
                  {
                    "name": "🏷️ Tags Published",
                    "value": "$FORMATTED_TAGS",
                    "inline": false
                  },
                  {
                    "name": "📍 View Images",
                    "value": "[GHCR](https://github.com/${{ github.repository }}/pkgs/container/aiolivetv) | [Docker Hub](https://hub.docker.com/r/mrcanelas/aiolivetv)",
                    "inline": false
                  },
                  {
                    "name": "📝 View Release Notes",
                    "value": "[GitHub](https://github.com/${{ github.repository }}/releases/tag/${{ inputs.ref }})",
                    "inline": false
                  },
                  {
                    "name": "🔗 View Build",
                    "value": "[GitHub Actions](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})",
                    "inline": false
                  }
                ],
                "footer": {
                  "text": "AIOLiveTV CI",
                  "icon_url": "https://github.com/${{ github.repository_owner }}.png"
                },
                "timestamp": "$TIMESTAMP"
              }
            ]
          }
          EOF

          echo "Sending to Discord:"
          cat discord_payload.json

          # Send payload to Discord and capture response and status code
          http_response=$(curl -s -w "\n%{http_code}" -H "Content-Type: application/json" \
            -X POST \
            -d @discord_payload.json \
            "${{ secrets.DISCORD_WEBHOOK_URL }}")

          http_body=$(echo "$http_response" | sed '$d')
          http_code=$(echo "$http_response" | tail -n1)

          echo "HTTP Status Code: $http_code"
          echo "Discord Response Body: $http_body"

          if [ "$http_code" != "204" ]; then
            echo "Error sending to Discord webhook."
            exit 1
          fi

          echo "Message sent successfully!"

