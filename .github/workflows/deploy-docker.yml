name: Build and Deploy Docker Images

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git Ref
        required: true
        type: string

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
      channel: ${{ steps.tags.outputs.channel }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate tags
        id: tags
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          # Accept stable releases and Docker-compatible prerelease versions.
          if [[ ! "${INPUT_REF}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[a-zA-Z0-9-]+(\.[a-zA-Z0-9-]+)*)?$ || ${#INPUT_REF} -gt 128 ]]; then
            echo "Invalid version: ${INPUT_REF}; expected vMAJOR.MINOR.PATCH[-PRERELEASE]"
            exit 1
          fi

          MAJOR="${BASH_REMATCH[1]}"
          MAJOR_MINOR="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          PRERELEASE="${BASH_REMATCH[4]}"
          TAGS="${INPUT_REF}"
          # Prereleases never receive latest or stable major/minor aliases.
          if [[ -z "${PRERELEASE}" && "$(git rev-parse origin/main)" = "$(git rev-parse "${INPUT_REF}")" ]]; then
            TAGS="${TAGS} latest v${MAJOR_MINOR} v${MAJOR}"
          fi
          # Release metadata uses the package version, including its beta suffix.
          CHANNEL="stable"

          if [[ -z "${TAGS}" ]]; then
            echo "Empty Tags!"
            exit 1
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "channel=${CHANNEL}" >> $GITHUB_OUTPUT

  build:
    name: build (${{ matrix.suffix }})
    needs: setup
    permissions:
      packages: write
      contents: read
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Generate metadata
        run: node scripts/generateMetadata.cjs --channel=${{ needs.setup.outputs.channel }}

      - name: Build & Push
        id: build
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platform }}
          push: true
          context: .
          file: ./Dockerfile
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/aiolivetv,push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}

      - name: Export digest
        run: echo "${{ steps.build.outputs.digest }}" > "/tmp/${{ matrix.suffix }}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v7
        with:
          path: /tmp/${{ matrix.suffix }}
          archive: false
          retention-days: 1

  merge:
    name: Merge manifests
    needs: [setup, build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: '{amd64,arm64}'
          merge-multiple: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create and push manifests
        env:
          TAGS: ${{ needs.setup.outputs.tags }}
        run: |
          for tag in ${TAGS}; do
            docker buildx imagetools create \
              -t "ghcr.io/${{ github.repository_owner }}/aiolivetv:${tag}" \
              "ghcr.io/${{ github.repository_owner }}/aiolivetv@$(cat /tmp/digests/amd64)" \
              "ghcr.io/${{ github.repository_owner }}/aiolivetv@$(cat /tmp/digests/arm64)"
          done

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish to Docker Hub
        env:
          TAGS: ${{ needs.setup.outputs.tags }}
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/aiolivetv
          DOCKERHUB_IMAGE: docker.io/mrcanelas/aiolivetv
          VERSION: ${{ inputs.ref }}
        run: |
          # Copy the complete multi-platform image once with all release tags.
          # No rebuild is needed, and both amd64 and arm64 are preserved.
          TAG_ARGS=()
          for tag in ${TAGS}; do
            TAG_ARGS+=(--tag "${DOCKERHUB_IMAGE}:${tag}")
          done
          docker buildx imagetools create \
            "${TAG_ARGS[@]}" \
            "${GHCR_IMAGE}:${VERSION}"

  notify:
    name: Notify Discord
    needs: [setup, merge]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Send Discord Notification
        continue-on-error: true
        env:
          CHANNEL: ${{ needs.setup.outputs.channel }}
          TAGS: ${{ needs.setup.outputs.tags }}
          RELEASE_REF: ${{ inputs.ref }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_BUILDS_CHANNEL_ID: ${{ vars.DISCORD_BUILDS_CHANNEL_ID }}
        run: node scripts/notify-discord.cjs build
